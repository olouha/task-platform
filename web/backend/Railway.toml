[railway]
name = "task-platform-backend"
version = 2

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && playwright install chromium --with-deps"
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:8000}"

[deploy]
region = "singapore"
numInstances = 1
sleep = true

[[trigger]]
id = "daily-fetch"
name = "每日抓取价格"
cron = "0 8 * * *"
command = "cd services && python fetch_yantai.py"