[railway]
name = "task-platform-backend"
version = 2

[build]
builder = "nixpacks"
buildCommand = "cd web/backend && pip install -r requirements.txt"

[deploy]
startCommand = "cd web/backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthCheckPath = "/health"
region = "singapore"
rootDirectory = "web/backend"