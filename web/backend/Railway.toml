[railway]
name = "task-platform-backend"
version = 2

[build]
builder = "nixpacks"
nixpacksVersion = "1"

[deploy]
startCommand = "bash start.sh"
healthCheckPath = "/health"
region = "singapore"

[watch]
enabled = false

[[trigger]]
id = "daily-fetch"
name = "每日抓取价格"
cron = "0 8 * * *"
command = "python services/fetch_yantai.py"